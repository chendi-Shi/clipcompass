[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipcompass"
version = "0.1.0"
description = "Reproducible short-video content understanding and recommendation lab"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "torch>=2.2,<3"]

[project.optional-dependencies]
content = ["Pillow>=10,<13"]
research = ["pandas>=2,<3", "scipy==1.15.3", "scikit-learn==1.6.1", "transformers==4.48.3", "peft==0.14.0", "Pillow>=10,<13", "requests>=2.32,<3", "matplotlib>=3.8,<4"]

[project.scripts]
clipcompass = "clipcompass.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clipcompass*"]
